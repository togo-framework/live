name: Bug report
description: Report a problem with the togo live plugin
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: A clear description + steps to reproduce (include LIVE_MODE and the channel). }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: live / togo version }
  - type: textarea
    id: env
    attributes: { label: Environment, description: OS, Go version, responder (echo/claude/cmd), DB driver. }
